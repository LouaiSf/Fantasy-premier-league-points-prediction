# Render blueprint for the Flask API (webapp/app.py).
# The Next.js frontend (webapp/frontend) is deployed separately on Vercel and
# points at this service through NEXT_PUBLIC_API_BASE.
services:
  - type: web
    name: fpl-assistant-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r webapp/requirements.txt
    # One worker: the predictions are cached in process memory, and a second
    # worker would only double the RAM on a 512 MB instance. The long timeout
    # covers /api/refresh, which shells out to a data pull of up to 120 s.
    startCommand: gunicorn webapp.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ALLOWED_ORIGINS
        sync: false   # set in the dashboard to the Vercel URL once it exists
